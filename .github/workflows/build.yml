name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag without v prefix (e.g. 1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 关键：必须拉取所有历史记录，否则无法获取完整的 commit log

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/release.keystore

      - name: Write keystore.properties
        run: |
          cat > app/keystore.properties << EOF
          storeFile=/home/runner/.android/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Get version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update versionCode in build.gradle.kts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          BUILD=$(echo $VERSION | cut -d. -f4)
          BUILD=${BUILD:-0}
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD))
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          echo "Updated versionCode to $VERSION_CODE"

      - name: Update versionName in build.gradle.kts
        run: |
          sed -i 's/versionName = ".*"/versionName = "${{ steps.version.outputs.version }}"/' app/build.gradle.kts

      - name: Build release APKs
        run: ./gradlew assembleRelease

      - name: Rename APKs with version
        id: rename_apks
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK_DIR="app/build/outputs/apk/release"
          DEST_DIR="apks"
          mkdir -p $DEST_DIR
          
          for APK in $APK_DIR/*.apk; do
            BASENAME=$(basename "$APK" .apk)
            ARCH=$(echo "$BASENAME" | sed 's/app-\(.*\)-release/\1/')
          
            if [ "$ARCH" = "universal" ]; then
              NEW_NAME="SunshineSend-${TAG}-universal.apk"
            else
              NEW_NAME="SunshineSend-${TAG}-${ARCH}.apk"
            fi
          
            cp "$APK" "$DEST_DIR/$NEW_NAME"
            echo "Renamed: $NEW_NAME"
          done
          
          echo "apk_dir=$DEST_DIR" >> "$GITHUB_OUTPUT"
          ls -la $DEST_DIR/

      # --- 新增：自动生成 Changelog ---
      - name: Generate Changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          # 获取上一个 tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            # 如果是第一个 tag，获取所有提交记录
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            # 获取两个 tag 之间的提交记录
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..${CURRENT_TAG} --reverse)
          fi
          
          # 将多行日志输出到 GitHub Actions 的环境变量中
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- 修改：使用自动生成的 Changelog ---
      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## 更新日志
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: ${{ steps.rename_apks.outputs.apk_dir }}/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 移除：Update HISTORY.md 和 Commit and push HISTORY.md 步骤 ---